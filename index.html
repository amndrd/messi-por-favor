<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Messi por favor</title>
<link rel="icon" href="/images/website-logo.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<!-- Intro : la taupe sort de son trou et explose en popcorn (une fois par onglet, un clic la passe) -->
<script src="/js/pop-styles.js"></script>
<script src="/js/intro.js"></script>

<!-- Icônes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></symbol>
  <!-- Lecteur -->
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4.5M10.5 5.5 4 12l6.5 6.5"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1"/><rect x="14" y="4" width="4.5" height="16" rx="1"/></symbol>
  <symbol id="i-rw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5a8.5 8.5 0 1 0 2.6-6.1L3.5 9"/><path d="M3.5 4.5V9H8"/><text x="12.6" y="15.6" text-anchor="middle" font-size="7.6" font-weight="700" font-family="Inter, system-ui, sans-serif" fill="currentColor" stroke="none">10</text></symbol>
  <symbol id="i-ff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12.5a8.5 8.5 0 1 1-2.6-6.1L20.5 9"/><path d="M20.5 4.5V9H16"/><text x="11.4" y="15.6" text-anchor="middle" font-size="7.6" font-weight="700" font-family="Inter, system-ui, sans-serif" fill="currentColor" stroke="none">10</text></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4.5v14l-5-4.5H3.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.5 6.2a8 8 0 0 1 0 11.6"/></symbol>
  <symbol id="i-vol-low" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4.5v14l-5-4.5H3.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4.5v14l-5-4.5H3.5z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.8v14.4L16 12z"/><path d="M19.5 4.5v15"/></symbol>
  <symbol id="i-eps" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="14.5" height="11" rx="1.5"/><path d="M6 5.5h12.5A1.5 1.5 0 0 1 20 7v9.5"/><path d="M9.5 2.5h11a1 1 0 0 1 1 1v9"/></symbol>
  <symbol id="i-subs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5h17v12H11l-4.5 3.5v-3.5h-3z"/><path d="M7 8.5h5M14.5 8.5H17M7 12.5h3M12.5 12.5H17"/></symbol>
  <symbol id="i-speed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.6 18.4a9 9 0 1 1 12.8 0"/><path d="m12 12.5 4-4.5"/><circle cx="12" cy="12.5" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-fs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9V3.5H9M15 3.5h5.5V9M20.5 15v5.5H15M9 20.5H3.5V15"/></symbol>
  <symbol id="i-fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5V9H3.5M20.5 9H15V3.5M15 20.5V15h5.5M3.5 15H9v5.5"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><rect x="12" y="11.5" width="7" height="5.5" rx="1"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3M12 14.5v2.5"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 7.7-1.6M12 14.5v2.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</svg>

<header class="header">
  <div class="wrap header-in">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="mobile-nav"><svg class="ic"><use href="#i-menu"/></svg></button>
    <a class="logo" href="/" data-link aria-label="Messi por favor, accueil" title="Messi por favor"><svg class="logo-face" viewBox="100 106 200 170" aria-hidden="true"><path d="M195,134 C194,129 191,125 187,122 M205,134 C206,129 209,125 213,122" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><g fill="none" stroke="currentColor" stroke-width="15"><circle cx="156" cy="194" r="34"/><circle cx="244" cy="194" r="34"/></g><rect x="186" y="188" width="28" height="12" rx="3" fill="currentColor"/><ellipse cx="200" cy="246" rx="25" ry="16" fill="currentColor"/><g class="logo-wl" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M166,248 L110,241 M166,259 L112,265"/></g><g class="logo-wr" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M234,248 L290,241 M234,259 L288,265"/></g></svg></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="/catalogue" data-link data-tab="catalogue">Catalogue</a>
      <a href="/collections" data-link data-tab="collections">Collections</a>
      <a href="/catalogue?liste=1" data-link data-tab="liste">Ma liste</a>
    </nav>
    <div class="header-right">
      <button class="kbd-btn" id="palette-btn" aria-label="Recherche rapide">
        <svg class="ic" style="width:12px;height:12px"><use href="#i-search"/></svg><kbd>⌘K</kbd>
      </button>
      <button class="user-btn quit-btn" id="quit-btn" title="Arrêter le site pour pouvoir éjecter le disque">
        <span class="icon-btn" aria-hidden="true"><svg class="ic"><use href="#i-power"/></svg></span>
        <span class="label">Quitter</span>
      </button>
    </div>
  </div>
  <nav class="wrap mobile-nav" id="mobile-nav" aria-label="Navigation" hidden>
    <a href="/" data-link data-tab="accueil">Accueil</a>
    <a href="/catalogue" data-link data-tab="catalogue">Catalogue</a>
    <a href="/collections" data-link data-tab="collections">Collections</a>
    <a href="/catalogue?liste=1" data-link data-tab="liste">Ma liste</a>
  </nav>
</header>

<main id="view"><div class="loading label">Chargement…</div></main>

<div class="player" id="player" hidden>
  <video id="player-video" playsinline preload="metadata"></video>
  <div class="pl-subs" id="pl-subs" aria-hidden="true"></div>
  <div class="pl-shade" aria-hidden="true"></div>
  <div class="pl-tap" id="pl-tap" aria-hidden="true"></div>
  <div class="pl-flash" id="pl-flash" aria-hidden="true"></div>
  <div class="pl-hint left" id="pl-hint-l" aria-hidden="true"><svg class="pl-ic"><use href="#i-rw"/></svg><span>10 s</span></div>
  <div class="pl-hint right" id="pl-hint-r" aria-hidden="true"><svg class="pl-ic"><use href="#i-ff"/></svg><span>10 s</span></div>
  <div class="pl-spin" id="pl-spin" hidden aria-hidden="true"></div>
  <div class="player-msg" id="player-msg" hidden><p></p></div>

  <div class="pl-ui" id="pl-ui">
    <div class="pl-top">
      <button class="pl-btn" id="pl-close" aria-label="Retour">
        <svg class="pl-ic d-only"><use href="#i-back"/></svg><svg class="pl-ic m-only"><use href="#i-x"/></svg>
      </button>
      <div class="pl-title"><span class="label" id="pl-sub"></span><strong id="pl-name"></strong></div>
      <span class="spacer"></span>
      <button class="pl-btn m-only" id="pl-pip" aria-label="Image dans l'image"><svg class="pl-ic"><use href="#i-pip"/></svg></button>
      <button class="pl-btn m-only" id="pl-fs" data-act="fullscreen" aria-label="Plein écran"><svg class="pl-ic"><use href="#i-fs"/></svg></button>
      <button class="pl-btn m-only" id="pl-lock" aria-label="Verrouiller l'écran"><svg class="pl-ic"><use href="#i-unlock"/></svg></button>
    </div>

    <div class="pl-bright m-only" id="pl-bright" role="slider" aria-label="Luminosité" aria-valuemin="20" aria-valuemax="100" aria-valuenow="100">
      <svg class="pl-ic"><use href="#i-sun"/></svg>
      <div class="pl-vrail"><div class="pl-vfill" id="pl-bright-fill"></div></div>
    </div>

    <div class="pl-center m-only">
      <button class="pl-btn" data-act="rw" aria-label="Reculer de 10 secondes"><svg class="pl-ic"><use href="#i-rw"/></svg></button>
      <button class="pl-btn pl-big" data-act="play" aria-label="Lecture"><svg class="pl-ic"><use href="#i-play"/></svg></button>
      <button class="pl-btn" data-act="ff" aria-label="Avancer de 10 secondes"><svg class="pl-ic"><use href="#i-ff"/></svg></button>
    </div>

    <div class="pl-bottom" id="pl-bottom">
      <div class="pl-seek">
        <div class="pl-bar" id="pl-bar" role="slider" tabindex="-1" aria-label="Position dans la vidéo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="pl-rail"><div class="pl-buf" id="pl-buf"></div><div class="pl-fill" id="pl-fill"></div><div class="pl-hover" id="pl-hover"></div></div>
          <div class="pl-knob" id="pl-knob"></div>
          <div class="pl-tip label" id="pl-tip">0:00</div>
        </div>
        <button class="pl-time" id="pl-time" title="Temps restant / écoulé">0:00</button>
      </div>

      <div class="pl-row d-only">
        <button class="pl-btn" data-act="play" aria-label="Lecture"><svg class="pl-ic"><use href="#i-play"/></svg></button>
        <button class="pl-btn" data-act="rw" aria-label="Reculer de 10 secondes"><svg class="pl-ic"><use href="#i-rw"/></svg></button>
        <button class="pl-btn" data-act="ff" aria-label="Avancer de 10 secondes"><svg class="pl-ic"><use href="#i-ff"/></svg></button>
        <div class="pl-vol" id="pl-vol">
          <button class="pl-btn" data-act="mute" aria-label="Couper le son"><svg class="pl-ic"><use href="#i-vol"/></svg></button>
          <div class="pl-vol-slider" id="pl-vol-slider" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100">
            <div class="pl-rail"><div class="pl-fill" id="pl-vol-fill"></div></div><div class="pl-knob" id="pl-vol-knob"></div>
          </div>
        </div>
        <span class="spacer"></span>
        <button class="pl-btn" data-act="next" data-series aria-label="Épisode suivant"><svg class="pl-ic"><use href="#i-next"/></svg></button>
        <button class="pl-btn" data-act="episodes" data-series aria-label="Épisodes"><svg class="pl-ic"><use href="#i-eps"/></svg></button>
        <button class="pl-btn" data-act="audio" aria-label="Audio et sous-titres"><svg class="pl-ic"><use href="#i-subs"/></svg></button>
        <button class="pl-btn" data-act="speed" aria-label="Vitesse de lecture"><svg class="pl-ic"><use href="#i-speed"/></svg></button>
        <button class="pl-btn" data-act="fullscreen" aria-label="Plein écran"><svg class="pl-ic"><use href="#i-fs"/></svg></button>
      </div>

      <div class="pl-row-m m-only">
        <button class="pl-tbtn" data-act="speed"><svg class="pl-ic"><use href="#i-speed"/></svg><span id="pl-speed-lbl">Vitesse (1x)</span></button>
        <button class="pl-tbtn" data-act="episodes" data-series><svg class="pl-ic"><use href="#i-eps"/></svg><span>Épisodes</span></button>
        <button class="pl-tbtn" data-act="audio"><svg class="pl-ic"><use href="#i-subs"/></svg><span>Audio et sous-titres</span></button>
        <button class="pl-tbtn" data-act="next" data-series><svg class="pl-ic"><use href="#i-next"/></svg><span>Ép. suivant</span></button>
      </div>
    </div>
  </div>

  <div class="pl-panel" id="pl-panel" hidden></div>
  <button class="pl-unlock" id="pl-unlock" hidden><svg class="pl-ic"><use href="#i-lock"/></svg><span><b>Écran verrouillé</b><small>Touchez pour déverrouiller</small></span></button>
</div>

<div id="modals"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="offline" id="offline" role="alert" hidden>
  <span class="label">Site arrêté</span>
  <p>Messi por favor ne tourne plus. Pour le relancer, double-clique sur « ▶ Messi por favor », tout en haut du disque.</p>
</div>

<script src="/js/app.js"></script>
</body>
</html>
